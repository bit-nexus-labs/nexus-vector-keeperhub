name: Deploy static replay to GitHub Pages

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
      - "tools/check_repository_hygiene.py"
      - "tools/verify_public_evidence.py"
      - "tests/test_static_replay_ui.py"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
      - "tools/check_repository_hygiene.py"
      - "tools/verify_public_evidence.py"
      - "tests/test_static_replay_ui.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static replay artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Verify public repository and replay artifact
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q frontend tests tools
          python tools/check_repository_hygiene.py
          python tools/verify_public_evidence.py
          python -m unittest discover -s tests -p "test_static_replay_ui.py" -v

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # pinned upstream 2026-08-02
        with:
          path: ./frontend
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy reviewed artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pinned upstream 2026-08-02
