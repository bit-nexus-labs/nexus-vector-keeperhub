name: Temporary repository snapshot QA

on:
  push:
    branches:
      - feature/mission-control-unequal-amounts-v2
    paths:
      - ".github/workflows/repo-snapshot-qa.yml"

permissions:
  contents: read

jobs:
  snapshot:
    name: Package tracked review surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Upload review snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-vector-repo-snapshot
          path: |
            README.md
            docs
            evidence
            frontend
            src
            tests
            tools
            pyproject.toml
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
