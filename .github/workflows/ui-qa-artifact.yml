name: Temporary Mission Control UI QA artifact

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ui-qa-artifact.yml"

permissions:
  contents: read

concurrency:
  group: temporary-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package exact frontend bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Upload exact frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mission-control-ui-qa
          path: frontend
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
